# Render Blueprint — static site (no backend).
services:
  - type: web
    name: jvo-website
    runtime: static
    buildCommand: npm install -g pnpm@10.4.1 && pnpm install && pnpm build
    staticPublishPath: ./dist/public
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
    routes:
      # SPA fallback so client-side routes (/pricing, /booking, ...) work
      - type: rewrite
        source: /*
        destination: /index.html

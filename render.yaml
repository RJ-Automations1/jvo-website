# Render Blueprint — Node web service (serves the built frontend + booking API
# + the membership-activation pipeline: /admin dashboard, /onboard portal).
services:
  - type: web
    name: jvo-website
    runtime: node
    buildCommand: npm install -g pnpm@10.4.1 && pnpm install && pnpm build
    startCommand: pnpm start
    autoDeploy: true
    # Persistent disk for the members SQLite DB + document uploads.
    disk:
      name: jvo-member-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # Node 24 — better-sqlite3 13 SEGFAULTS under Render's Node 20 (verified
      # painfully on the jvo-events service). Do NOT downgrade.
      - key: NODE_VERSION
        value: "24"
      # Google service-account JSON (same account as JVO Events). SECRET — set in
      # the Render dashboard, do NOT commit. Paste the full key file contents.
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      # The "JVO Office" calendar — bookings are checked against + written to it.
      # It must be shared with the service account ("Make changes to events")
      # or free/busy lookups will 404.
      - key: JVO_CALENDAR_ID
        value: "5e39a34a1b48df3ae7baa65d57b57d2ce46e482a040985343617c96dbdc5004e@group.calendar.google.com"
      - key: JVO_TIMEZONE
        value: "America/New_York"
      # --- Membership-activation pipeline ---
      - key: DB_PATH
        value: /data/jvo-members.db
      - key: UPLOADS_DIR
        value: /data/uploads
      # Staff dashboard Basic Auth — SECRET, set in the Render dashboard.
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Kill switch: while "false" every member email is a dry-run log line.
      - key: MEMBER_EMAILS_ENABLED
        value: "false"
      # Gmail app-password SMTP (same creds as the jvo-events service) — SECRET.
      # ── Mailbox application filing ────────────────────────────────────────
      # Dropbox APP credentials (App Console -> scoped access app), NOT an
      # account password. Scope required: files.content.write.
      # All three are SECRET — set them in the Render dashboard.
      - key: DROPBOX_APP_KEY
        sync: false
      - key: DROPBOX_APP_SECRET
        sync: false
      - key: DROPBOX_REFRESH_TOKEN
        sync: false
      # Parent folder that per-client folders are created under.
      - key: DROPBOX_ROOT
        value: "/JVO Mailbox Applications"
      # Gmail SMTP for the staff notification. SMTP_PASS is a Google App Password
      # (myaccount.google.com/apppasswords), not the account password. SECRET.
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Where the "new member signup" alert lands. Comma-separated for the whole
      # team, e.g. "office@jvo.com,manager@jvo.com". Defaults to SMTP_USER.
      - key: NOTIFY_TO
        sync: false
      # Client master list. The spreadsheet must be shared as an Editor with the
      # service account in GOOGLE_SERVICE_ACCOUNT_JSON, or appends 403.
      # ID is the long string in the sheet URL: /spreadsheets/d/<THIS>/edit
      - key: JVO_SHEET_ID
        sync: false
      - key: JVO_SHEET_TAB
        value: "Clients"
      # ── Website chatbot (/api/chat) ───────────────────────────────────────
      # Anthropic API key from https://console.anthropic.com/settings/keys.
      # SECRET — set in the Render dashboard. Without it the widget still loads
      # but answers with a "call or email us" fallback instead of erroring.
      - key: ANTHROPIC_API_KEY
        sync: false
      # ── Stripe (room booking payments) ────────────────────────────────────
      # Bookings are pay-first: no calendar event exists until Stripe confirms
      # the charge. Without STRIPE_SECRET_KEY the booking page tells customers
      # to call instead — it never books a paid space for free.
      # SECRET — set in the Render dashboard. Use sk_live_… to take real money.
      - key: STRIPE_SECRET_KEY
        sync: false
      # Signing secret for the webhook endpoint. Create it at
      # Dashboard → Developers → Webhooks → add endpoint:
      #   https://jonesborovirtualoffice.com/api/stripe/webhook
      # subscribing to checkout.session.completed, .expired,
      # .async_payment_succeeded and .async_payment_failed.
      # The SAME endpoint also settles invoice payments (/admin/invoices), which
      # are told apart by session metadata — there is only one webhook to set up.
      # Without it the webhook rejects every event; bookings and invoices then
      # rely on the slower reconcile-on-return path, so treat this as required.
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Absolute origin Stripe returns customers to, and the origin of the
      # invoice pay links emailed to members. Must be the live domain — a wrong
      # value sends paying customers to a dead page.
      - key: PUBLIC_BASE_URL
        value: "https://jonesborovirtualoffice.com"
      # ── Card processing surcharge ─────────────────────────────────────────
      # Added to CARD payments as its own Stripe line item, on BOTH room
      # bookings and membership invoices (server/cardFee.ts is the one reader).
      # Cash and check, recorded by staff, never carry it, and a free booking
      # such as a tour never attracts one. Set to 0 to switch the fee off
      # everywhere; capped at 10 in code so a typo can't overcharge.
      - key: CARD_FEE_PERCENT
        value: "3"
      # ── Member rate verification ──────────────────────────────────────────
      # "I am a member" on the booking form checks the email here first, then
      # falls back to the local members table. Same credentials as jvo-events.
      - key: DESKWORKS_API_KEY
        sync: false
      - key: DESKWORKS_BASE_URL
        value: "https://jvo.satellitedeskworks.com"
      # The path that looks a member up by email, with a {email} placeholder,
      # e.g. "/api/v1/centers/6/users?email={email}".
      # DELIBERATELY UNSET: the token currently issued for this account is a
      # read-only *catalog* token — it serves /centers and
      # /centers/:id/reservations but 404s on every user/member/customer path.
      # Until Deskworks issues a member-scoped token and confirms the path,
      # member checks use the local members table only. Setting this var is the
      # only change needed to switch Deskworks on — no code change.
      - key: DESKWORKS_MEMBER_PATH
        sync: false
      # Optional: defaults to claude-opus-5. Set CHAT_MODEL=claude-haiku-4-5
      # for a cheaper, faster FAQ bot if volume grows.
      - key: CHAT_MODEL
        sync: false

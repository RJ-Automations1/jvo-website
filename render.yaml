# Render Blueprint — Node web service (serves the built frontend + booking API
# + the membership-activation pipeline: /admin dashboard, /onboard portal).
services:
  - type: web
    name: jvo-website
    runtime: node
    buildCommand: npm install -g pnpm@10.4.1 && pnpm install && pnpm build
    startCommand: pnpm start
    autoDeploy: true
    # Persistent disk for the members SQLite DB + document uploads.
    disk:
      name: jvo-member-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # Node 24 — better-sqlite3 13 SEGFAULTS under Render's Node 20 (verified
      # painfully on the jvo-events service). Do NOT downgrade.
      - key: NODE_VERSION
        value: "24"
      # Google service-account JSON (same account as JVO Events). SECRET — set in
      # the Render dashboard, do NOT commit. Paste the full key file contents.
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      # The "JVO Office" calendar — bookings are checked against + written to it.
      # It must be shared with the service account ("Make changes to events")
      # or free/busy lookups will 404.
      - key: JVO_CALENDAR_ID
        value: "5e39a34a1b48df3ae7baa65d57b57d2ce46e482a040985343617c96dbdc5004e@group.calendar.google.com"
      - key: JVO_TIMEZONE
        value: "America/New_York"
      # --- Membership-activation pipeline ---
      - key: DB_PATH
        value: /data/jvo-members.db
      - key: UPLOADS_DIR
        value: /data/uploads
      # Staff dashboard Basic Auth — SECRET, set in the Render dashboard.
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Kill switch: while "false" every member email is a dry-run log line.
      - key: MEMBER_EMAILS_ENABLED
        value: "false"
      # Gmail app-password SMTP (same creds as the jvo-events service) — SECRET.
      # ── Mailbox application filing ────────────────────────────────────────
      # Dropbox APP credentials (App Console -> scoped access app), NOT an
      # account password. Scope required: files.content.write.
      # All three are SECRET — set them in the Render dashboard.
      - key: DROPBOX_APP_KEY
        sync: false
      - key: DROPBOX_APP_SECRET
        sync: false
      - key: DROPBOX_REFRESH_TOKEN
        sync: false
      # Parent folder that per-client folders are created under.
      - key: DROPBOX_ROOT
        value: "/JVO Mailbox Applications"
      # Gmail SMTP for the staff notification. SMTP_PASS is a Google App Password
      # (myaccount.google.com/apppasswords), not the account password. SECRET.
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Where the "new member signup" alert lands. Comma-separated for the whole
      # team, e.g. "office@jvo.com,manager@jvo.com". Defaults to SMTP_USER.
      - key: NOTIFY_TO
        sync: false
      # Client master list. The spreadsheet must be shared as an Editor with the
      # service account in GOOGLE_SERVICE_ACCOUNT_JSON, or appends 403.
      # ID is the long string in the sheet URL: /spreadsheets/d/<THIS>/edit
      - key: JVO_SHEET_ID
        sync: false
      - key: JVO_SHEET_TAB
        value: "Clients"

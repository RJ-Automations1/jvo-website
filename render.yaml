# Render Blueprint — Node web service (serves the built frontend + booking API
# + the membership-activation pipeline: /admin dashboard, /onboard portal).
services:
  - type: web
    name: jvo-website
    runtime: node
    buildCommand: npm install -g pnpm@10.4.1 && pnpm install && pnpm build
    startCommand: pnpm start
    autoDeploy: true
    # Persistent disk for the members SQLite DB + document uploads.
    disk:
      name: jvo-member-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # Node 24 — better-sqlite3 13 SEGFAULTS under Render's Node 20 (verified
      # painfully on the jvo-events service). Do NOT downgrade.
      - key: NODE_VERSION
        value: "24"
      # Google service-account JSON (same account as JVO Events). SECRET — set in
      # the Render dashboard, do NOT commit. Paste the full key file contents.
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      # The "JVO Office" calendar — bookings are checked against + written to it.
      # It must be shared with the service account ("Make changes to events")
      # or free/busy lookups will 404.
      - key: JVO_CALENDAR_ID
        value: "5e39a34a1b48df3ae7baa65d57b57d2ce46e482a040985343617c96dbdc5004e@group.calendar.google.com"
      - key: JVO_TIMEZONE
        value: "America/New_York"
      # --- Membership-activation pipeline ---
      - key: DB_PATH
        value: /data/jvo-members.db
      - key: UPLOADS_DIR
        value: /data/uploads
      # Staff dashboard Basic Auth — SECRET, set in the Render dashboard.
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Kill switch: while "false" every member email is a dry-run log line.
      - key: MEMBER_EMAILS_ENABLED
        value: "false"
      # Gmail app-password SMTP (same creds as the jvo-events service) — SECRET.
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # ── Website chatbot (/api/chat) ───────────────────────────────────────
      # Anthropic API key from https://console.anthropic.com/settings/keys.
      # SECRET — set in the Render dashboard. Without it the widget still loads
      # but answers with a friendly "email/call us" fallback instead of erroring.
      # Default model is claude-opus-5; set CHAT_MODEL=claude-haiku-4-5 for a
      # cheaper high-volume FAQ bot.
      #
      # NOTE: production is the jvo-website-node service, which this blueprint
      # does NOT manage — setting this here does not set it there.
      - key: ANTHROPIC_API_KEY
        sync: false

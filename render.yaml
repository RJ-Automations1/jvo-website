# Render Blueprint — Node web service (serves the built frontend + booking API).
services:
  - type: web
    name: jvo-website
    runtime: node
    buildCommand: npm install -g pnpm@10.4.1 && pnpm install && pnpm build
    startCommand: pnpm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      # Google service-account JSON (same account as JVO Events). SECRET — set in
      # the Render dashboard, do NOT commit. Paste the full key file contents.
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      # Calendar that bookings are checked against + written to.
      - key: JVO_CALENDAR_ID
        value: "1830514f596a30e51ac9c83a2700e915b87ddd99115031e62d788dde64733d57@group.calendar.google.com"
      - key: JVO_TIMEZONE
        value: "America/New_York"
